name: UI and API Automation Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    # 1. Запускаем тесты и складываем сырые логи в папку allure-results
    - name: Run tests with Allure
      run: |
        pytest --alluredir=allure-results
      continue-on-error: true

    # 2. Скачиваем официальную консольную утилиту Allure CLI (без всяких докеров)
    - name: Install Allure CLI via Node.js
      run: |
        npm install -g allure-commandline --save-dev

    # 3. Генерируем красивую статическую HTML-папку из сырых результатов
    - name: Generate Allure Report HTML
      run: |
        allure generate allure-results --clean -o allure-report

    # 4. Упаковываем и выкладываем готовый отчет в артефакты сборки
    - name: Upload Allure Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: allure-html-report
        path: allure-report
        retention-days: 7
