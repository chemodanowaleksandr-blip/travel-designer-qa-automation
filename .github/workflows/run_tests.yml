name: UI and API Automation Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Даем пайплайну права на запись и публикацию веб-страниц
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Run tests with Allure
      run: |
        pytest --alluredir=allure-results
      continue-on-error: true

    - name: Install Allure CLI
      run: |
        npm install -g allure-commandline --save-dev

    # Скачиваем историю прошлых тестов (чтобы на графиках были видны тренды)
    - name: Get Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    # Генерируем отчет с учетом истории
    - name: Generate Allure Report
      run: |
        mkdir -p allure-report
        if [ -d "gh-pages/history" ]; then cp -r gh-pages/history allure-results/; fi
        allure generate allure-results --clean -o allure-report

    # САМЫЙ ВАЖНЫЙ ШАГ: Публикуем отчет на GitHub Pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages
